services:
  - type: web
    name: housecall-bot
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: housecall-db
          property: connectionString
      - key: CONFIG_DIR
        value: ./config
      - key: ROSTER_FILE
        value: /etc/secrets/roster.yaml
      - key: LLM_MODEL
        value: claude-opus-5
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: housecall-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
